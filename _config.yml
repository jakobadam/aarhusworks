# Site settings
#
# NOTE: this file is *NOT* reloaded automatically by `jekyll serve`.
# Restart the server after editing it.

title: Aarhusworks
email: jakob@aarhusworks.com
description: >-
  Dokumentation af offentlige arbejder i Aarhus — vejstøj, høringssvar og
  aktindsigt fra Giber Ringvej Gruppen — samt tekniske noter om softwareudvikling.
lang: da
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://aarhusworks.com"
github_username: jakobadam

author:
  name: Jakob Aarøe Dam

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap

# Most posts never declared a layout, so they were rendered as bare markup with
# no <html> wrapper and no stylesheet. Defaults fix that centrally; anything
# with an explicit `layout:` in its front matter still wins.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page

# Primary navigation, rendered by _includes/header.html
nav:
  - title: Vejstøj
    url: /vejstoej/
  - title: Arkiv
    url: /arkiv/
  - title: Om
    url: /om/

# The campaign category. Posts carrying this category are treated as case
# documents: they get the dossier styling and appear on /vejstoej/.
campaign_category: vejstøj

exclude:
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - node_modules/
  - bin/
  - sandbox/
  - serve-it.sh
  - extract_ramboell_pdfs.py
  - CLAUDE.md
  - README.md
  - vendor/
  # jekyll-readme-index (bundled with github-pages) turns any README.md into the
  # directory's index page — this one is developer notes, not site content.
  - assets/fonts/README.md
