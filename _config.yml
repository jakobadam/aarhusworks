# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Aarhusworks
email: jakob@aarhusworks.com
description: >- # this means to ignore newlines until "baseurl:"
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://aarhusworks.com" # the base hostname & protocol for your site, e.g. http://example.com
#twitter_username: jekyllrb
github_username:  jakobadam
lang: da

# Byline. The portrait appears only on posts whose `author` contains
# author_name, and only once the image file exists (see _includes/byline.html).
author_name: Jakob Aarøe Dam
author_image: /assets/profil.png
# Bio in the author card, chosen by the post's category, or by `bio:` in the
# post's front matter (which does not move its URL, unlike a category). A post
# with neither gets `default`; leave that empty to show the name alone.
author_bios:
  vejstøj: Talsperson for Giber Ringvej Gruppen. Skriver om vejstøj, trafik og kommunal forvaltning i Aarhus.
  default: ""

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-redirect-from

# Exclude from processing. Setting this list replaces Jekyll's defaults, so
# they are repeated here. The rest is repository tooling that was being
# published (aarhusworks.com/CLAUDE.html, /bin/, /package.json).
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - CLAUDE.md
  - README.md
  - bin
  - package.json
  - package-lock.json
  - serve-it.sh
